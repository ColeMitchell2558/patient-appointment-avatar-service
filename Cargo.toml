[package]
name = "patient-avatar-service"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
axum = "0.7.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }
